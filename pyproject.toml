[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microduck"
version = "0.1.0"
description = "RL training environments for the Microduck robot, built on mjlab"
readme = { file = "README", content-type = "text/plain" }
license = "Apache-2.0"
license-files = ["LICENSE"]
# <3.13: bam (better-actuator-models) requires python <3.13.
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    # Distribution name of `bam`.
    "better-actuator-models",
    "onnxruntime>=1.24.4",
    "rustypot>=1.4.2",
    "huggingface_hub>=0.27.0",
    "matplotlib>=3.10.9",
    # mjlab 1.3.0 imports scipy but does not declare it.
    "scipy>=1.16",
    # Direct dep with an exact pin so [tool.uv.sources] can route the aarch64 wheel (sources apply to direct deps only).
    "torch==2.9.1",
]

[project.entry-points."mjlab.tasks"]
mjlab_microduck = "src.task_registry"

[project.scripts]
duck-body = "src.sim_body_server:main"
publish = "src.publish_cli:main"
export = "src.export:main"
infer = "src.infer:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
namespace = true

[tool.ruff]
indent-width = 4
line-length = 5000
target-version = "py312"

[tool.ruff.format]
# With the very large line-length, this means a collection wraps only when it
# genuinely cannot fit on one line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Everything not listed here is expected to pass, so `make lint` can gate.
ignore = [
    # mjlab's config idiom: `asset_cfg: SceneEntityCfg = SceneEntityCfg("robot", ...)`
    # as a parameter default, used by every mdp function in task_mdp.py.
    # These defaults ARE mutable and mjlab DOES mutate them (ManagerBase
    # ._resolve_common_term_cfg calls `resolve(scene)` in place), but it
    # resolves the cfg objects held in term params, not the function defaults,
    # and resolution is idempotent per scene.
    "B008",
    # Deliberate best-effort guards around optional monkey-patches and
    # hardware/IO paths; narrowing them changes runtime failure modes on the
    # robot for no correctness gain.
    "BLE001",
    "S110",
    # Nested `if` often encodes two distinct preconditions (state exists /
    # sensor is wired); collapsing into one `and` obscures that.
    "SIM102",
    # Class-level constant lookup tables are never mutated; ClassVar
    # annotations everywhere would be noise.
    "RUF012",
]

[tool.ruff.lint.isort]
# Must match format.skip-magic-trailing-comma, else isort and the formatter
# disagree about trailing commas in import blocks.
split-on-trailing-comma = false

[tool.uv]
override-dependencies = [
    # bam pins protobuf<4.0, which would drag onnx down to a wheel-less version.
    "protobuf>=4.0,<7.0",
    # Keep onnx on a version with prebuilt wheels.
    "onnx>=1.20.1",
    # bam depends on the broken PyPI stub `zmq==0.0.0`; we never use bam's zmq messaging.
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
# The mjlab-facing API lives on this branch, not on the default branch.
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "mjlab_frictionloss" }
# PyPI's linux-aarch64 torch wheel is CPU-only; cu129 matches the CUDA toolkit warp 1.12.0 bundles.
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
