[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microduck"
version = "0.1.0"
description = "RL training environments for the Microduck robot, built on mjlab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# bam (better-actuator-models) requires python <3.13.
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab==1.3.0",
    "warp-lang==1.12.0",
    # Distribution name of `bam`.
    "better-actuator-models",
    "onnxruntime>=1.24.4",
    "rustypot>=1.4.2",
    "huggingface_hub>=0.27.0",
    "matplotlib>=3.10.9",
    # mjlab 1.3.0 imports scipy but does not declare it.
    "scipy>=1.16",
    # Must stay a direct dep with an `==` pin, else the aarch64 routing below breaks.
    # See tests/test_aarch64_cuda_torch.py.
    "torch==2.9.1",
]

[project.entry-points."mjlab.tasks"]
mjlab_microduck = "src.task_registry"

[project.scripts]
# Serve a simulated body to the real `robotd` — see sim_body_server.py.
duck-body = "src.sim_body_server:main"
publish = "src.publish_cli:main"
export = "src.export:main"
infer = "src.infer:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
namespace = true

[tool.ruff]
indent-width = 4
line-length = 5000
target-version = "py312"

[tool.ruff.format]
# With the large line-length, a collection wraps only if it cannot fit on one line.
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
# Must match format.skip-magic-trailing-comma, else isort and the formatter disagree.
split-on-trailing-comma = false

[tool.uv]
override-dependencies = [
    # bam pins protobuf<4.0, which would drag onnx down to a wheel-less version.
    "protobuf>=4.0,<7.0",
    # Keep onnx on a version with prebuilt wheels.
    "onnx>=1.20.1",
    # bam depends on the broken PyPI stub `zmq==0.0.0`; bam's zmq messaging is unused.
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
# The mjlab-facing BAM API lives on this branch, not on a release.
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", branch = "mjlab_frictionloss" }
# PyPI's linux-aarch64 torch wheel is CPU-only; cu129 matches warp 1.12.0's CUDA toolkit.
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
